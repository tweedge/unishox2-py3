name: ci

# secret use is OK per https://github.community/t/how-secure-are-secrets/139115
on: [push, pull_request]

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        exclude:
          # ubuntu-latest (26.04) has no Python 3.9 build; use 24.04 for it.
          - os: ubuntu-latest
            python-version: "3.9"
        include:
          - os: ubuntu-24.04
            python-version: "3.9"
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest hypothesis
      - name: Build unishox2
        run: |
          pip install .
      - name: Extended test with pytest
        run: |
          pytest --hypothesis-profile ci

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install black
        run: |
          python -m pip install --upgrade pip
          pip install black==26.10.1
      - name: Lint with black
        run: |
          black --check --diff .
      - name: Install flawfinder
        run: |
          sudo apt install flawfinder
      - name: Lint with flawfinder
        run: |
          flawfinder unishox2_module.c

  codespell:
    name: codespell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: codespell-project/actions-codespell@v2
        with:
          check_filenames: true
          skip: ./.git,./demo.py,./tests.py

  # Builds the sdist on every run and hands it to the publish job as an artifact.
  source_dist:
    needs: pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist
      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  # Builds and tests wheels on every push and PR so a broken wheel build is
  # caught before merge. Previously this job was main-only, which is how a broken
  # wheel build shipped through a PR; it now runs everywhere and only the publish
  # job below uploads, and only after every build has succeeded.
  cibuildwheel:
    needs: pytest
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up QEMU
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all
      - name: Build and test wheels
        uses: pypa/cibuildwheel@v4.3.5
        env:
          CIBW_ARCHS_WINDOWS: auto
          CIBW_ARCHS_MACOS: "x86_64 arm64 universal2"
          # Keep the arches 1.0.0 shipped except i686, whose QEMU-emulated
          # container intermittently loses DNS for pip and fails the whole job.
          # (riscv64/armv7l are new to cibuildwheel and are slow, low-value
          # QEMU targets, so they are left out too.)
          CIBW_ARCHS_LINUX: "x86_64 aarch64 ppc64le s390x"
          CIBW_TEST_COMMAND: pytest {package}
          CIBW_TEST_REQUIRES: pytest hypothesis
      - name: Upload wheels artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  # Single publish job: runs only on main and only if pytest, the sdist build,
  # and every wheel build succeeded. Publishing from one place prevents the
  # partial release where one OS failed but the others had already uploaded.
  publish:
    needs: [source_dist, cibuildwheel]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      TWINE_USERNAME: ${{ secrets.TWINE_USERNAME }}
      TWINE_PASSWORD: ${{ secrets.TWINE_PASSWORD }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List artifacts
        run: ls -R dist
      - name: Publish to PyPI
        run: |
          python -m pip install --upgrade pip twine
          twine upload dist/* --skip-existing
