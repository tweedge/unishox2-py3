name: ci

# secret use is OK per https://github.community/t/how-secure-are-secrets/139115
on: [push, pull_request]

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        exclude:
          # ubuntu-latest (26.04) has no Python 3.9 build; use 24.04 for it.
          - os: ubuntu-latest
            python-version: "3.9"
        include:
          - os: ubuntu-24.04
            python-version: "3.9"
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest hypothesis
      - name: Build unishox2
        run: |
          pip install .
      - name: Extended test with pytest
        run: |
          pytest --hypothesis-profile ci

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install black
        run: |
          python -m pip install --upgrade pip
          pip install black==26.10.1
      - name: Lint with black
        run: |
          black --check --diff .
      - name: Install flawfinder
        run: |
          sudo apt install flawfinder
      - name: Lint with flawfinder
        run: |
          flawfinder unishox2_module.c

  codespell:
    name: codespell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: codespell-project/actions-codespell@v2
        with:
          check_filenames: true
          skip: ./.git,./demo.py,./tests.py

  # Builds the sdist on every run and hands it to the publish job as an artifact.
  source_dist:
    needs: pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist
      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  # Builds and tests wheels on every push and PR so a broken wheel build is
  # caught before merge. Previously this job was main-only, which is how a broken
  # wheel build shipped through a PR.
  #
  # The matrix is sharded deliberately. cibuildwheel builds one interpreter at a
  # time, so a single job doing every arch x every Python version is fully
  # serial and painfully slow -- especially the emulated Linux arches (aarch64,
  # ppc64le, s390x under QEMU). Because wheels are now collected by the publish
  # job at the end, each shard can run in parallel on its own runner.
  #
  # Shards: Linux is split by architecture and each arch (except fast native
  # x86_64) is split into two Python-version groups; macOS and Windows are split
  # by Python group. Group A = 3.9-3.12, group B = 3.13-3.15 (the "cp31x*"
  # patterns also catch the free-threaded "t" variants).
  cibuildwheel:
    needs: pytest
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            archs: "x86_64"
            build: "cp39* cp310* cp311* cp312* cp313* cp314* cp315*"
          - name: linux-aarch64-a
            os: ubuntu-latest
            archs: "aarch64"
            build: "cp39* cp310* cp311* cp312*"
          - name: linux-aarch64-b
            os: ubuntu-latest
            archs: "aarch64"
            build: "cp313* cp314* cp315*"
          - name: linux-ppc64le-a
            os: ubuntu-latest
            archs: "ppc64le"
            build: "cp39* cp310* cp311* cp312*"
          - name: linux-ppc64le-b
            os: ubuntu-latest
            archs: "ppc64le"
            build: "cp313* cp314* cp315*"
          - name: linux-s390x-a
            os: ubuntu-latest
            archs: "s390x"
            build: "cp39* cp310* cp311* cp312*"
          - name: linux-s390x-b
            os: ubuntu-latest
            archs: "s390x"
            build: "cp313* cp314* cp315*"
          - name: macos-a
            os: macos-latest
            archs: "x86_64 arm64 universal2"
            build: "cp39* cp310* cp311* cp312*"
          - name: macos-b
            os: macos-latest
            archs: "x86_64 arm64 universal2"
            build: "cp313* cp314* cp315*"
          - name: windows-a
            os: windows-latest
            archs: "AMD64 x86"
            build: "cp39* cp310* cp311* cp312*"
          - name: windows-b
            os: windows-latest
            archs: "AMD64 x86"
            build: "cp313* cp314* cp315*"
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up QEMU
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all
      - name: Build and test wheels
        uses: pypa/cibuildwheel@v4.3.5
        env:
          CIBW_ARCHS: ${{ matrix.archs }}
          CIBW_BUILD: ${{ matrix.build }}
          CIBW_TEST_COMMAND: pytest {package}
          CIBW_TEST_REQUIRES: pytest hypothesis
      - name: Upload wheels artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.name }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  # Single publish job: runs only on main and only if pytest, the sdist build,
  # and every wheel build succeeded. Publishing from one place prevents the
  # partial release where one OS failed but the others had already uploaded.
  publish:
    needs: [source_dist, cibuildwheel]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      TWINE_USERNAME: ${{ secrets.TWINE_USERNAME }}
      TWINE_PASSWORD: ${{ secrets.TWINE_PASSWORD }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List artifacts
        run: ls -R dist
      - name: Publish to PyPI
        run: |
          python -m pip install --upgrade pip twine
          twine upload dist/* --skip-existing
