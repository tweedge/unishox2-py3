name: ci

# secret use is OK per https://github.community/t/how-secure-are-secrets/139115
#
# Run on PRs and on pushes to main only. Listing both without a branch filter
# would run every job twice per PR commit (once for the push, once for the PR);
# main is the only branch that publishes, so restricting push to it keeps the
# build/test-on-PR, publish-on-main split and halves the work.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        exclude:
          # ubuntu-latest (26.04) has no Python 3.9 build; use 24.04 for it.
          - os: ubuntu-latest
            python-version: "3.9"
        include:
          - os: ubuntu-24.04
            python-version: "3.9"
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest hypothesis
      - name: Build unishox2
        run: |
          pip install .
      - name: Extended test with pytest
        run: |
          pytest --hypothesis-profile ci

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install black
        run: |
          python -m pip install --upgrade pip
          pip install black==26.10.1
      - name: Lint with black
        run: |
          black --check --diff .
      - name: Install flawfinder
        run: |
          sudo apt install flawfinder
      - name: Lint with flawfinder
        run: |
          flawfinder unishox2_module.c

  codespell:
    name: codespell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: codespell-project/actions-codespell@v2
        with:
          check_filenames: true
          skip: ./.git,./demo.py,./tests.py

  # Builds the sdist on every run and hands it to the publish job as an artifact.
  source_dist:
    needs: pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: build sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist
      - name: Upload sdist artifact
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  # Builds and tests wheels on every push and PR so a broken wheel build is
  # caught before merge. Previously this job was main-only, which is how a broken
  # wheel build shipped through a PR.
  #
  # cibuildwheel builds one interpreter at a time, so a single job covering
  # every arch x every Python version runs fully serially. Split into one shard
  # per architecture and let them run in parallel on separate runners; the
  # publish job collects all wheel artifacts at the end. Adding or dropping an
  # architecture is a one-line matrix change.
  #
  # Tests run after each wheel build. On the emulated Linux arches (everything
  # but native x86_64) the test step is skipped: it is very slow under QEMU and
  # the hypothesis test dependency has no musllinux wheel for s390x, so pip would
  # try to build it (and its Rust toolchain) from source under emulation.
  cibuildwheel:
    needs: pytest
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            archs: "x86_64"
          - name: linux-aarch64
            os: ubuntu-latest
            archs: "aarch64"
          - name: linux-ppc64le
            os: ubuntu-latest
            archs: "ppc64le"
          - name: linux-s390x
            os: ubuntu-latest
            archs: "s390x"
          - name: macos
            os: macos-latest
            archs: "x86_64 arm64 universal2"
          - name: windows
            os: windows-latest
            archs: "AMD64 x86"
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Set up QEMU
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: all
      - name: Build and test wheels
        uses: pypa/cibuildwheel@v4.3.5
        env:
          CIBW_ARCHS: ${{ matrix.archs }}
          # This package supports CPython only (see setup.cfg), so select CPython
          # explicitly rather than relying on cibuildwheel's default build set.
          CIBW_BUILD: "cp3*"
          CIBW_TEST_COMMAND: pytest {package}
          CIBW_TEST_REQUIRES: pytest hypothesis
          # Skip tests on emulated Linux arches: they are slow under QEMU, and
          # hypothesis 6.168+ ships compiled wheels but has no musllinux s390x
          # wheel, so pip falls back to building it from source (via maturin /
          # Rust) and that fails under emulation. Wheels still build; they are
          # tested on x86_64, and the pytest matrix covers all Python versions.
          CIBW_TEST_SKIP: "*-*linux_{aarch64,ppc64le,s390x,armv7l}"
      - name: Upload wheels artifact
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.name }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  # Single publish job: runs only on main and only if pytest, the sdist build,
  # and every wheel build succeeded. Publishing from one place prevents the
  # partial release where one OS failed but the others had already uploaded.
  #
  # Publishing uses PyPI Trusted Publishing (OIDC) instead of a stored API token:
  # the job mints a short-lived token from PyPI via GitHub's OIDC identity, so
  # no long-lived secret exists to leak. Trusted Publishing also makes the
  # official PyPA action generate PEP 740 provenance attestations for every file
  # by default, which PyPI displays on the project's Security tab. This requires
  # a Trusted Publisher to be configured on PyPI for this repo + this workflow
  # file; see the PR description for the one-time setup.
  publish:
    needs: [source_dist, cibuildwheel]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      # Mandatory for Trusted Publishing: lets the job request the OIDC token
      # PyPI exchanges for a short-lived upload token.
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: List artifacts
        run: ls -R dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Attestations are generated and uploaded by default under Trusted
          # Publishing; this is stated explicitly so it is not accidentally lost.
          attestations: true
          # Keep parity with the previous twine behaviour: re-runs on main must
          # not fail just because earlier files already exist.
          skip-existing: true
